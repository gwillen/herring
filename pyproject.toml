[project]
name = "herring"
version = "0.0.0"
description = "Puzzlehunt team progress tracking and task management"
readme = "README.md"
license = "MIT"
requires-python = "==3.10.*"
dependencies = [
    "Django==3.2.16",
    "Unidecode==1.3.6",
    "Whoosh==2.7.4",
    "dj-database-url==1.0.0",
    "dj-static==0.0.6",
    "gunicorn==20.1.0",
    "natsort==8.2.0",
    "psycopg2==2.9.5",
    "pyOpenSSL==22.1.0",
    "requests==2.28.1",
    "static3==0.7.0",
    "urllib3==1.26.12",
    "celery[redis]==5.2.7",
    "django-autoslug==1.9.8",
    "google-api-python-client==1.7.11",
    "django-model-utils==4.2.0",
    "django-environ==0.9.0",
    "redis==3.5.3",
    "bs4==0.0.1",
    "google-auth==1.10.0",
    "lazy-object-proxy==1.8.0",
    "celery-redbeat==2.0.0",
    "websockets==10.4",
    "discord.py==2.1.0",
    "aiohttp==3.7.4",
    "yarl==1.8.1",
    # django-model-utils 4.2 imports pkg_resources, which pip-made venvs
    # provided implicitly. Recent setuptools versions removed it.
    "setuptools<80",
]

[dependency-groups]
# Local development only; Heroku installs with --no-default-groups.
dev = [
    "honcho",
    "watchdog",
]

[tool.uv]
# Herring is an application, not an installable package.
package = false
# Supply-chain safety: ignore releases newer than this when resolving.
exclude-newer = "14 days"
