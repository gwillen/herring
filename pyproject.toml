[project]
name = "herring"
version = "0.0.0"
description = "Puzzlehunt team progress tracking and task management"
readme = "README.md"
license = "MIT"
requires-python = "==3.14.*"
dependencies = [
    "Django>=5.2,<5.3",  # 5.2 LTS; supported until April 2028
    "aiohttp>=3.13",
    "asgiref>=3.8",
    "cachetools>=6",
    "celery[redis]>=5.6",
    "celery-redbeat>=2.4",
    "discord.py>=2.7",
    "django-autoslug>=1.9.9",
    "django-environ>=0.14",
    "django-model-utils>=5.0",
    "google-api-python-client>=2.200",
    "google-auth>=2.50",
    "gunicorn>=26",
    "psycopg[binary]>=3.3",
    "redis>=6",
    "whitenoise>=6.12",
]

[dependency-groups]
# Local development only; Heroku installs with --no-default-groups.
dev = [
    "honcho",
    "watchdog",
]

[tool.uv]
# Herring is an application, not an installable package.
package = false
# Supply-chain safety: ignore releases newer than this when resolving.
exclude-newer = "14 days"
