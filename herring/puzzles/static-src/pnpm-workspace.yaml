# pnpm settings for the frontend build. (This is a single package, not a
# multi-package workspace; pnpm reads its settings from this file.)

# Supply-chain safety:
# Don't install versions published less than 14 days ago (in minutes).
minimumReleaseAge: 20160
# Transitive dependencies may only come from the registry, not git/tarball URLs.
blockExoticSubdeps: true
# Refuse versions whose publishing trust level is lower than earlier versions'.
trustPolicy: no-downgrade
# Dependencies' install scripts are blocked unless listed here. esbuild's
# postinstall only verifies/optimizes its binary, which arrives anyway as the
# platform-specific optional dependency (@esbuild/<platform>).
allowBuilds:
  esbuild: false
