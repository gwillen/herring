# Local development stack. See README.md.
#
# Run a second, independent copy (e.g. for tests) with a different project
# name, which gives it its own containers and database volume:
#   docker compose -p herring-test ...
services:
    project:
        build:
            context: .
            args:
                HERRING_UID: "${HERRING_UID:-1000}"
                HERRING_GID: "${HERRING_GID:-1000}"
        # Run as the host user, so files created in the bind-mounted source
        # tree (staticfiles, new migrations) aren't owned by root.
        user: "${HERRING_UID:-1000}:${HERRING_GID:-1000}"
        ports:
            - "${HERRING_PORT:-8000}:5000"
        environment:
            REDIS_URL: redis://redis:6379/0
            DATABASE_URL: postgres://postgres:pgpass@postgres/postgres
        volumes:
            - .:/opt/project
        command: ./docker-project-command.sh
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
    postgres:
        image: postgres:17-alpine
        volumes:
            - postgres-data:/var/lib/postgresql/data
        environment:
            POSTGRES_PASSWORD: pgpass
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "postgres"]
            interval: 1s
            retries: 30
    redis:
        image: redis:7-alpine

volumes:
    postgres-data:
